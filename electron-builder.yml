appId: com.oratio.app
productName: Oratio
copyright: MIT

directories:
  buildResources: build
  output: release

# An ALLOW-list, not a block-list.
#
# This was a list of exclusions, which fails open: anything new in the repo
# shipped by default, and a build was found carrying the whole test harness,
# the .tsbuildinfo caches, and CLAUDE.md — local working notes that are
# gitignored precisely so they stay private. Naming what goes in means a new
# directory has to be added deliberately rather than remembered about.
#
# node_modules is implicit; electron-builder resolves production dependencies
# itself, which is what puts the native modules in place for asarUnpack below.
files:
  - 'out/**'
  - 'resources/**'
  - 'package.json'
  - 'LICENSE'
  - '!**/*.map'

asarUnpack:
  # Native .node binaries and the AudioTee Swift helper cannot be executed
  # from inside an asar archive — they must exist as real files on disk.
  - '**/*.node'
  - '**/node_modules/audiotee/**'
  - '**/node_modules/sherpa-onnx-*/**'
  # The Core Audio process-list probe. Same rule as the binaries above: it is
  # exec'd, and nothing can be exec'd from inside an asar archive.
  - 'resources/audio-processes'

mac:
  # Ship only the sherpa binary this target can actually load.
  #
  # `supportedArchitectures` in pnpm-workspace.yaml installs the Windows
  # binaries so the Windows port can be built, but its `os` and `cpu` lists are
  # applied as a CROSS PRODUCT — asking for win32+x64 unavoidably also matches
  # darwin+x64. On this arm64-only DMG that silently added 65 MB of Intel-macOS
  # dylibs, taking the installer from 146 MB to 165 MB. Nothing warns about it;
  # the build simply gets bigger, which is exactly the kind of regression
  # nobody goes looking for.
  #
  # Filtered here rather than by narrowing the pnpm setting because `cpu:
  # [current]` drops sherpa-onnx-win-x64 too — verified — and the Windows port
  # needs it present. The build target is the only place that knows which
  # single binary is loadable.
  #
  # `sherpa-onnx-node/addon.js` resolves `sherpa-onnx-${platform}-${arch}` at
  # runtime, so an absent directory is never reached on a matching host. A
  # Windows target will need the mirror image of this list.
  files:
    - '!**/node_modules/sherpa-onnx-win-*/**'
    - '!**/node_modules/sherpa-onnx-linux-*/**'
    - '!**/node_modules/sherpa-onnx-darwin-x64/**'
  category: public.app-category.productivity
  # Stated explicitly rather than relying on the buildResources convention.
  # A missing icon does not fail the build — it silently ships the default
  # Electron logo, which is how the first DMG went out.
  # Regenerate with: node scripts/make-app-icon.mjs
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64]
  # macOS 14.2+ is required for the Core Audio process-tap API that
  # AudioTee uses to capture system audio.
  minimumSystemVersion: '14.2'
  darkModeSupport: true
  # Ad-hoc sign the bundle: '-' is codesign's pseudo-identity, so the whole app
  # is signed with no certificate. NOT `null` — electron-builder reads that as
  # "skip signing" ("skipped macOS code signing reason=identity explicitly is
  # set to null") and leaves the bundle exactly as broken as omitting it.
  #
  # Leaving this unset skips signing altogether, which does not produce an
  # *unsigned* app: Electron's own binary arrives from upstream already
  # linker-signed, with a code directory declaring sealed resources. Drop our
  # code and Info.plist in without re-signing and the seal describes a bundle
  # that no longer exists — `codesign --verify` fails with "code has no
  # resources but signature indicates they must be present".
  #
  # macOS treats that as a BROKEN signature, not a missing one, and says "is
  # damaged and can't be opened". Right-click → Open does not clear it — that
  # bypass only overrides unknown *provenance*, never an invalid signature —
  # and on macOS 15+ neither does deleting the quarantine attribute. The build
  # machine never sees it, because a locally built app is never quarantined and
  # so is never assessed. It only fails on someone else's Mac.
  #
  # Still unsigned by a recognised developer, so first launch keeps the
  # ordinary right-click → Open step. Removing that needs a Developer ID and
  # notarization.
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # TCC permission strings. NSAudioCaptureUsageDescription is a SEPARATE
    # permission from the microphone — it is what gates Core Audio taps.
    NSMicrophoneUsageDescription: >-
      Oratio records your microphone so your side of the meeting can be
      transcribed on this device.
    NSAudioCaptureUsageDescription: >-
      Oratio records system audio so the other participants can be
      transcribed on this device.
    NSCalendarsUsageDescription: >-
      Oratio reads your calendar to label recordings with the meeting they
      belong to. Calendar data never leaves this device.
    # Menu-bar app: no Dock icon, no window on launch.
    LSUIElement: true

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Open-source build: ad-hoc signed (see `identity` above), not notarized.
# Users will need to right-click → Open on first launch.
