# Only these may run install scripts. Everything else is denied by default,
# which is the point: a postinstall script is the usual payload delivery
# mechanism in an npm supply-chain compromise.
allowBuilds:
  better-sqlite3: true # native SQLite bindings, must compile
  esbuild: true # fetches its platform binary
  electron: true # postinstall downloads the Electron binary itself
  electron-winstaller: false # Windows installer; macOS-only project

# Supply-chain hardening.
#
# Refuse to resolve any package version published less than 7 days ago.
# Compromised npm releases are typically detected and unpublished within
# days, so a cooldown means a malicious version is usually pulled before
# it can ever be installed here.
#
# pnpm 11+ reads this from pnpm-workspace.yaml — NOT .npmrc, which is
# auth/registry only since v11. The default is 1440 (1 day); we want 7.
minimumReleaseAge: 10080 # minutes = 7 days

# If a package ever must bypass the cooldown (a real security fix that
# can't wait), list it here rather than lowering the global value:
# minimumReleaseAgeExclude:
#   - some-package

# better-sqlite3 and sherpa-onnx-node ship native code that must be
# compiled/linked against Electron's ABI rather than Node's. electron-builder
# handles this via the postinstall `install-app-deps` step.
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild

# Install sherpa-onnx's Windows binaries alongside the host platform's.
#
# `sherpa-onnx-node` already declares sherpa-onnx-win-x64 and -win-ia32 in its
# own optionalDependencies, so nothing is missing from the dependency graph —
# pnpm simply filters optional deps by the *installing* platform, and a macOS
# install never fetches them. This asks for them anyway, which is what the
# release build's "sherpa-onnx-win-* is not installed" warning is about.
#
# Declared here rather than added to our own `optionalDependencies`: pinning a
# version alongside sherpa's `^1.13.4` would silently drift out of step on the
# next sherpa upgrade, and CLAUDE.md already requires re-verifying sherpa on
# every upgrade.
#
# `current` is required, not implied — omitting it would drop the host's own
# darwin-arm64 binary and break local development entirely.
#
# There is deliberately no win32/arm64 entry: sherpa publishes no
# sherpa-onnx-win-arm64 package, and addon-static-import.js maps arm64 to
# darwin and linux only. Windows on ARM therefore has no local ASR path at all
# — see docs/WINDOWS.md §7.
supportedArchitectures:
  os:
    - current
    - win32
  cpu:
    - current
    - x64
